<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Toggle</title>

    <style>

        /* Page */

        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:linear-gradient(135deg,#4f46e5,#7c3aed);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        /* Card */

        .container{
            background:white;
            width:320px;
            padding:30px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        h1{
            margin-bottom:25px;
            color:#333;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        #toggleBtn{
            background:#4f46e5;
            color:white;
        }

        #toggleBtn:hover{
            background:#3730a3;
        }

    </style>

</head>

<body>

    <div class="container">

        <!-- Heading -->

        <h1>Password Toggle</h1>

        <!-- Username -->

        <input
        type="text"
        placeholder="Enter Username"
        >

        <!-- Password -->

        <input
        type="password"
        id="password"
        placeholder="Enter Password"
        >

        <!-- Button -->

        <button id="toggleBtn">
            Show Password
        </button>

    </div>

    <script>

        // Select Password Input

        let password = document.getElementById("password");

        // Select Button

        let toggleBtn = document.getElementById("toggleBtn");

        // Button Click Event

        toggleBtn.addEventListener("click", function(){

            // Check Current Type

            if(password.getAttribute("type") === "password"){

                // Show Password

                password.setAttribute("type","text");

                toggleBtn.textContent = "Hide Password";

            }

            else{

                // Hide Password

                password.setAttribute("type","password");

                toggleBtn.textContent = "Show Password";

            }

        });

    </script>

</body>
</html>
