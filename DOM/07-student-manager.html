<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Manager</title>

    <style>

        /* Page */

        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        /* Card */

        .container{
            width:700px;
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 8px 20px rgba(0,0,0,0.15);
        }

        /* Heading */

        h1{
            text-align:center;
            color:#2c3e50;
            margin-bottom:25px;
        }

        /* Input */

        input{

            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #cccccc;
            border-radius:8px;
            box-sizing:border-box;
            font-size:16px;

        }

        input:focus{

            outline:none;
            border:2px solid #3498db;

        }

        /* Add Button */

        #addBtn{

            width:100%;
            padding:12px;
            margin-top:10px;
            background:#3498db;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;

        }

        #addBtn:hover{

            background:#2980b9;

        }

        /* Table */

        table{

            width:100%;
            margin-top:30px;
            border-collapse:collapse;

        }

        th{

            background:#2c3e50;
            color:white;
            padding:12px;

        }

        td{

            border:1px solid #dddddd;
            padding:10px;
            text-align:center;

        }

        tr:nth-child(even){

            background:#f8f9fa;

        }

        tr:hover{

            background:#eaf4ff;

        }

    </style>

</head>

<body>

<div class="container">

    <!-- Heading -->

    <h1>Student Manager</h1>

    <!-- Student Name -->

    <input
    type="text"
    id="studentName"
    placeholder="Enter Student Name"
    >

    <!-- Roll Number -->

    <input
    type="text"
    id="rollNumber"
    placeholder="Enter Roll Number"
    >

    <!-- Department -->

    <input
    type="text"
    id="department"
    placeholder="Enter Department"
    >

    <!-- Button -->

    <button id="addBtn">
        Add Student
    </button>

    <!-- Table -->

    <table>

        <thead>

            <tr>

                <th>Name</th>

                <th>Roll No</th>

                <th>Department</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody id="studentTable">

            <!-- JavaScript will add rows here -->

        </tbody>

    </table>

</div>

<script>
   // Step 1 : Select Input Boxes

let studentName = document.getElementById("studentName");

let rollNumber = document.getElementById("rollNumber");

let department = document.getElementById("department");

// Step 2 : Select Button

let addBtn = document.getElementById("addBtn");

// Step 3 : Select Table Body

let studentTable = document.getElementById("studentTable");

// Step 4 : Button Click Event

addBtn.addEventListener("click", function () {

    // Step 5 : Read Input Values

    let name = studentName.value;

    let roll = rollNumber.value;

    let dept = department.value;

    // Step 6 : Empty Validation

    if (name === "" || roll === "" || dept === "") {

        alert("Please fill all fields");

        return;

    }

    // Step 7 : Create Table Row

    let row = document.createElement("tr");

    let col1 = document.createElement("td");

    let col2 = document.createElement("td");

    let col3 = document.createElement("td");

    let col4 = document.createElement("td");

    // Step 8 : Add Data

    col1.textContent = name;

    col2.textContent = roll;

    col3.textContent = dept;

    // Step 9 : Create Delete Button

    let deleteBtn = document.createElement("button");

    deleteBtn.textContent = "Delete";

    // Step 10 : Delete Button Style

    deleteBtn.style.backgroundColor = "red";

    deleteBtn.style.color = "white";

    deleteBtn.style.border = "none";

    deleteBtn.style.padding = "8px 15px";

    deleteBtn.style.borderRadius = "5px";

    deleteBtn.style.cursor = "pointer";

    // Step 11 : Add Delete Button to Column

    col4.appendChild(deleteBtn);

    // Step 12 : Add Columns to Row

    row.appendChild(col1);

    row.appendChild(col2);

    row.appendChild(col3);

    row.appendChild(col4);

    // Step 13 : Add Row to Table

    studentTable.appendChild(row);

    // Step 14 : Delete Student

    deleteBtn.addEventListener("click", function () {

        row.remove();

    });

    // Step 15 : Clear Input Boxes

    studentName.value = "";

    rollNumber.value = "";

    department.value = "";

});
</script>

</body>

</html>
